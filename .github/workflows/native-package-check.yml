name: Validate Native Packages

# A cloud-only validation path. It deliberately does not sign or submit builds.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel compiled into the test bundle
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run native:build
        env:
          NEXT_PUBLIC_OTA_CHANNEL: ${{ inputs.channel }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_TRAVELPAYOUTS_TRS: ${{ vars.TRAVELPAYOUTS_TRS }}
          NEXT_PUBLIC_TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
      - name: Sync Android container
        run: |
          APP_BUILD_VERSION=$(git log -1 --format=%ct) npx cap sync android
      - run: chmod +x android/gradlew && (cd android && ./gradlew assembleDebug --no-daemon)
      - uses: actions/upload-artifact@v4
        with:
          name: rallii-rail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run native:build
        env:
          NEXT_PUBLIC_OTA_CHANNEL: ${{ inputs.channel }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_TRAVELPAYOUTS_TRS: ${{ vars.TRAVELPAYOUTS_TRS }}
          NEXT_PUBLIC_TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
      - name: Sync iOS container
        run: |
          APP_BUILD_VERSION=$(git log -1 --format=%ct) npx cap sync ios
      - name: Compile iOS app without signing
        run: xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
