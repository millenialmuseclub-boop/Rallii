name: Submit iOS Build to App Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version
        required: true
        default: "1.2"
      build_number:
        description: Processed App Store Connect build number
        required: true
        default: "12"
      submit_for_review:
        description: Submit after updating release metadata
        required: true
        default: true
        type: boolean

jobs:
  submit:
    runs-on: macos-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install App Store release tooling
        run: gem install fastlane --no-document
      - name: Submit the existing build for review and automatic release
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/metadata/en-US
          printf '%s\n' 'Rallii' > fastlane/metadata/en-US/name.txt
          cat > fastlane/metadata/en-US/release_notes.txt <<'NOTES'
          Green, Trail, and MTB are three new ways to explore with Rallii. Trail and MTB use compact, tap-to-open region lists, with trip-planning links for stays, flights, activities, and car hire.
          NOTES
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :release do
              key = app_store_connect_api_key(
                key_id: ENV.fetch("APP_STORE_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_ISSUER_ID"),
                key_content: ENV.fetch("APP_STORE_PRIVATE_KEY"),
                in_house: false
              )
              deliver(
                api_key: key,
                app_identifier: "com.rallii.rail",
                app_version: ENV.fetch("APP_VERSION"),
                build_number: ENV.fetch("APP_BUILD_NUMBER"),
                skip_binary_upload: true,
                metadata_path: "fastlane/metadata",
                skip_metadata: false,
                skip_screenshots: true,
                submit_for_review: ENV.fetch("SUBMIT_FOR_REVIEW") == "true",
                automatic_release: true,
                force: true,
                precheck_include_in_app_purchases: false,
                submission_information: {
                  export_compliance_uses_encryption: false
                }
              )
            end
          end
          RUBY
          fastlane ios release
