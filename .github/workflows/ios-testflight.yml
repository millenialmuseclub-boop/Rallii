name: Upload iOS Build to TestFlight

# Manual only. A run creates a signed iOS archive and uploads it to the
# Rallii Rail TestFlight record; it never submits the app to App Review.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel compiled into the native bundle
        required: true
        default: production
        type: choice
        options: [staging, production]

jobs:
  testflight:
    runs-on: macos-latest
    environment: Production
    permissions:
      contents: read
    env:
      APPLE_TEAM_ID: J48FJJ3ABL
      APPLE_BUNDLE_ID: com.rallii.rail
      APPLE_PROFILE_NAME: Rallii Rail App Store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the static native bundle
        run: npm run native:build
        env:
          NEXT_PUBLIC_OTA_CHANNEL: ${{ inputs.channel }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_TRAVELPAYOUTS_TRS: ${{ vars.TRAVELPAYOUTS_TRS }}
          NEXT_PUBLIC_TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
      - name: Sync the iOS container
        run: npx cap sync ios
      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/rallii-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/rallii.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/rallii-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/rallii.mobileprovision"
      - name: Archive Rallii Rail
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/RalliiRail.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Export App Store archive
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RalliiRail.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload build to TestFlight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$APP_STORE_PRIVATE_KEY" > "$KEY_DIRECTORY/AuthKey_${APP_STORE_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID"
      - name: Preserve the archive for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rallii-rail-ios-archive-${{ github.run_number }}
          path: ${{ runner.temp }}/RalliiRail.xcarchive
          if-no-files-found: ignore
