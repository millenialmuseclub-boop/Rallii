<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Partner search</title>
  <base href="https://tpwdgt.com/" target="_blank">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; font-family: Arial, sans-serif; width: 100%; }
    body { display: flow-root; overflow-x: auto; }
    * { box-sizing: border-box; }
    #status { padding: 12px; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading partner search…</p>
  <script>
    const parameters = new URLSearchParams(location.search);
    const kind = parameters.get("kind");
    const statusElement = document.getElementById("status");
    const reportHeight = () => parent.postMessage({
      type: "rallii-partner-widget-height", kind, height: document.body.scrollHeight
    }, "*");
    new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener("load", reportHeight);
    if (!["stays", "flights", "cars", "activities"].includes(kind) || !parameters.get("trs") || !parameters.get("shmarker")) {
      statusElement.textContent = "Partner search is not configured.";
    } else {
      parameters.delete("kind");
      parameters.delete("reload");
      const script = document.createElement("script");
      script.async = true;
      script.charset = "utf-8";
      script.src = `https://tpwdgt.com/content?${parameters}`;
      // Script download success is not widget readiness: blocked subrequests can
      // leave an empty frame. Keep an actionable status until content appears.
      const unavailable = () => {
        statusElement.hidden = false;
        statusElement.textContent = "Partner search is unavailable. Reload the search or use the partner link below.";
        reportHeight();
      };
      let ready = false;
      const observedRoots = new WeakSet();
      // Agoda and Trip.com render inside a shadow root; ordinary document
      // queries and a body-only MutationObserver cannot see their forms.
      const searchRoots = root => {
        if (!root) return [];
        if (!observedRoots.has(root)) {
          observedRoots.add(root);
          contentObserver.observe(root, { childList: true, subtree: true });
        }
        const roots = [root];
        for (const element of root.querySelectorAll("*")) {
          if (element.shadowRoot) roots.push(...searchRoots(element.shadowRoot));
        }
        return roots;
      };
      const checkContent = () => {
        if (ready) return;
        const rendered = searchRoots(document.body).some(root => [...root.querySelectorAll("form, iframe, input[type=search], input[type=text]")].some(element => {
          const rect = element.getBoundingClientRect();
          return rect.width > 80 && rect.height > 20;
        }));
        if (rendered) {
          ready = true; clearTimeout(timeout); clearInterval(checkTimer);
          contentObserver.disconnect(); statusElement.hidden = true; reportHeight();
        }
      };
      const contentObserver = new MutationObserver(checkContent);
      contentObserver.observe(document.body, { childList: true, subtree: true });
      const checkTimer = setInterval(checkContent, 250);
      const timeout = setTimeout(() => { clearInterval(checkTimer); unavailable(); }, 15000);
      window.addEventListener("load", checkContent, true);
      script.onload = checkContent;
      script.onerror = () => { clearTimeout(timeout); clearInterval(checkTimer); unavailable(); };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
