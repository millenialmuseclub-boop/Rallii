<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f4d3d"/>
      <stop offset="1" stop-color="#143529"/>
    </linearGradient>
  </defs>
  <!-- ground: full bleed, no transparency, no rounded corners (mask applied by OS) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- outer ring: a single confident wayfinding circle -->
  <circle cx="512" cy="512" r="322" fill="none" stroke="#e4cd8f" stroke-width="10" opacity="0.55"/>

  <!-- four cardinal ticks -->
  <g stroke="#e4cd8f" stroke-width="10" opacity="0.55" stroke-linecap="round">
    <line x1="512" y1="150" x2="512" y2="190"/>
    <line x1="512" y1="834" x2="512" y2="874"/>
    <line x1="150" y1="512" x2="190" y2="512"/>
    <line x1="834" y1="512" x2="874" y2="512"/>
  </g>

  <!-- the mark: an asymmetric compass star, long spike north (the direction of travel), -->
  <!-- short spike south, standing in for a plane / needle / palm all at once -->
  <g>
    <path d="M512 176
             L560 486
             L512 512
             L464 486
             Z" fill="#c1502e"/>
    <path d="M512 848
             L472 566
             L512 512
             L552 566
             Z" fill="#e08a63"/>
    <path d="M176 512
             L474 472
             L512 512
             L474 552
             Z" fill="#c9a24b"/>
    <path d="M848 512
             L560 464
             L512 512
             L560 560
             Z" fill="#c9a24b"/>
  </g>

  <!-- center pin -->
  <circle cx="512" cy="512" r="26" fill="#fffaf2"/>
  <circle cx="512" cy="512" r="26" fill="none" stroke="#2a231c" stroke-width="4" opacity="0.15"/>
</svg>
