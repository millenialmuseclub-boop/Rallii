<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a3327"/>
      <stop offset="55%" stop-color="#33221a"/>
      <stop offset="100%" stop-color="#1e130e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d9a8"/>
      <stop offset="45%" stop-color="#ceab6f"/>
      <stop offset="100%" stop-color="#8a6a3f"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e6c4"/>
      <stop offset="100%" stop-color="#ceab6f"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d2a20"/>
      <stop offset="100%" stop-color="#26170f"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background — platform tooling applies its own corner mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Two small rose accents flanking the sparkle — the one restrained
       touch of the blush/rose-metal palette, kept as simple dots rather
       than a fussy ribbon that only reads at large sizes. -->
  <circle cx="382" cy="248" r="14" fill="#d9a9a0"/>
  <circle cx="642" cy="248" r="14" fill="#d9a9a0"/>

  <!-- The app's own established sparkle mark (same 4-point path used
       throughout Luxe Jetter's UI), scaled up as the icon's one flourish. -->
  <g transform="translate(512 232) scale(9.5)" fill="url(#goldSoft)">
    <path d="M12 1.5c0 4.5 1.2 7.3 2.5 8.9 1.4 1.7 3.9 2.6 8 2.6-4.1 0-6.6.9-8 2.6-1.3 1.6-2.5 4.4-2.5 8.9 0-4.5-1.2-7.3-2.5-8.9C8.1 14 5.6 13 1.5 13c4.1 0 6.6-.9 8-2.6C10.8 8.8 12 6 12 1.5Z" transform="translate(-12 -12)"/>
  </g>

  <!-- Center plate + LJ monogram -->
  <circle cx="512" cy="560" r="248" fill="url(#plate)"/>
  <circle cx="512" cy="560" r="248" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="512" cy="560" r="248" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="2"/>

  <text
    x="512" y="618" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="260"
    fill="url(#gold)" letter-spacing="-6"
  >LJ</text>
</svg>
